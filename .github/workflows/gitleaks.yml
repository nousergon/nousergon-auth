# Weekly full-history secret scan (alpha-engine-config-I3005).
#
# GitHub's native secret scanning matches its known provider-token formats on
# push only. It does not catch internal-shaped secrets, and it cannot see
# history committed before push protection existed. This caller runs the
# fleet's shared, checksum-pinned gitleaks scan over the whole history: on
# every push to main and weekly.
#
# BASELINE: two records, ONE verified non-secret (2026-10-24). A local run of
# the same gitleaks version (8.30.1) over this repo's full history (55 commits)
# found exactly one finding: `generic-api-key` at
# src/magic-link-templates.test.ts:24, commit 6d6a37a7 (2026-07-15). The
# matched value is the token query parameter of that test's fixture URL: an
# RFC 2606 example.com host and a literal marker string the test searches the
# rendered email for, in a test file. It authenticates nothing anywhere.
#
# The second record is the SAME value at a second location: commit e98d56b1
# (#67) quoted it in this comment, and the full-history scan flagged the quote
# (alpha-engine-config-I12633). This comment now describes the fixture without
# quoting it -- do not paste the value here again.
#
# Both records are in .gitleaks-baseline.json, copied from REDACTED reports;
# nothing else is baselined. Any other finding still fails the scan.

name: Gitleaks scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    uses: nousergon/nousergon-lib/.github/workflows/gitleaks-scan.yml@51206172feb68a6b6908197e2d4348568b8af061 # main 2026-10-22
