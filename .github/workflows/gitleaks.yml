# Weekly full-history secret scan (alpha-engine-config-I3005).
#
# GitHub's native secret scanning matches its known provider-token formats on
# push only. It does not catch internal-shaped secrets, and it cannot see
# history committed before push protection existed. This caller runs the
# fleet's shared, checksum-pinned gitleaks scan over the whole history: on
# every push to main and weekly.
#
# BASELINE: three records, ONE verified non-secret (2026-10-24). A local run of
# the same gitleaks version (8.30.1) over this repo's full history (55 commits)
# found exactly one finding: `generic-api-key` at
# src/magic-link-templates.test.ts:24, commit 6d6a37a7 (2026-07-15). The
# matched value is the token query parameter of that test's fixture URL: an
# RFC 2606 example.com host and a literal marker string the test searches the
# rendered email for, in a test file. It authenticates nothing anywhere.
#
# The second record is the SAME value at a second location: commit e98d56b1
# (#67) quoted it in this comment, and the full-history scan flagged the quote
# (alpha-engine-config-I12633). This comment now describes the fixture without
# quoting it -- do not paste the value here again.
#
# The third record is the SAME value once more, in .gitleaks-baseline.json
# itself (commit 8b17ff77, #69): the #67 record carries #67's commit Message
# verbatim, and that Message quotes the value. `--redact` redacts Secret and
# Match, not Message. The Message cannot be scrubbed, because gitleaks
# matches a baseline record on its full content, Message included. So the
# line stays as it is, and any commit that re-adds it needs its own record.
# Before committing a record copied from a report, check its Message for the
# value. A local run with --baseline-path pointing at the committed file
# cannot catch this, because gitleaks skips the baseline file itself. Scan
# with a temp copy of the baseline, as the shared workflow does.
#
# All three records are in .gitleaks-baseline.json, copied from REDACTED
# reports; nothing else is baselined. Any other finding still fails the scan.

name: Gitleaks scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    uses: nousergon/nousergon-lib/.github/workflows/gitleaks-scan.yml@40fb880521331d197a629f63a4de9e47ed071c6f # main 2026-10-22
