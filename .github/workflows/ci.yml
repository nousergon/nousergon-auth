# PR gate — typecheck + build + test run on every PR and push to main
# (alpha-engine-config#2527: deploy.yml alone meant a bad push to main deployed live with
# zero verification; alpha-engine-config#2546: vitest suite added, wired in as a step here
# rather than a separate job so the required check-context name ("typecheck + build") stays
# stable — it's a required status check on main).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The badge-publish step below writes `coverage.json` on the orphan
    # `badges` branch through the contents API. Nothing else in this job
    # writes, and the token is scoped no wider than that.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

      # repository-baseline-policy.md §5.1 — a badge whose value is written by
      # a human is forbidden: it renders identically to a real one and becomes
      # false the moment reality moves without anyone editing a file. This
      # repo had no coverage measurement at all before this PR. The README
      # badge now renders whatever this step last published, derived from the
      # same coverage/coverage-summary.json the vitest.config.ts threshold
      # gate reads.
      #
      # Pushes to main only: a pull-request run measures a tree that is not
      # yet what a reader of the README is looking at.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_coverage_badge.sh
