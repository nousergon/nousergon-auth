# PR gate — typecheck + build + test run on every PR and push to main
# (alpha-engine-config#2527: deploy.yml alone meant a bad push to main deployed live with
# zero verification; alpha-engine-config#2546: vitest suite added, wired in as a step here
# rather than a separate job so the required check-context name ("typecheck + build") stays
# stable — it's a required status check on main).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
