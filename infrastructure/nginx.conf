# nousergon-auth nginx site — installed to /etc/nginx/conf.d/nousergon-auth.conf on
# the shared dashboard box. Self-contained (own conf file, mirrors vires.conf's
# convention) since this is a single-purpose service on its own dedicated hostname —
# no other content shares auth.nousergon.ai. Cloudflare (orange-cloud) terminates the
# public edge and connects to this origin over 443 using the existing
# *.nousergon.ai origin cert.
#
# Deliberately NOT behind Cloudflare Access — this host IS the sign-in front door
# (magic-link request/verify, JWKS) for every product; an edge email-allowlist gate
# here would block the very flow it exists to serve.

server {
    listen 80;
    server_name auth.nousergon.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.nousergon.ai;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
